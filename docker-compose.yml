services:
  kafka:
    image: bitnamilegacy/kafka:3.3.2
    container_name: taskpulse-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

      - KAFKA_CFG_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      - ALLOW_PLAINTEXT_LISTENER=yes
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: taskpulse-kafka-ui
    ports:
      - "8081:8080"
    depends_on:
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=taskpulse-local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092

  postgres:
    image: postgres:15
    container_name: taskpulse-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=taskpulse
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres